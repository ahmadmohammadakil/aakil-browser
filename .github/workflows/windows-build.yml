name: Build AAKIL for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Build Electron Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AAKIL Electron installer
        run: pnpm electron:dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AAKIL-Windows-x64-Electron-Installer
          path: release/AAKIL-*-Windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpacked application for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: AAKIL-Windows-x64-Electron-unpacked
          path: release/win-unpacked/**
          if-no-files-found: warn
          retention-days: 30
